server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rotas do react-router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .mjs precisa de MIME de JavaScript, senão o navegador bloqueia o module worker
    # do pdf.js (o mime.types do nginx mapeia só .js, não .mjs) e o visualizador de PDF
    # quebra com "Não foi possível exibir o PDF". Regex tem prioridade sobre o /assets/
    # abaixo, então o cache dos assets versionados é re-declarado aqui.
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # cache de assets versionados (hash no nome)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
